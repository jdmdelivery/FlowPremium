# Blueprint Render — SQLite (plan free, sin Postgres ni disco persistente).
# Para PostgreSQL: añade DATABASE_URL. Para disco: upgrade a plan de pago.

services:
  - type: web
    name: flowpremium
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600 --graceful-timeout 120 app:app
    releaseCommand: flask init-db
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEED_DEFAULT_USERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
