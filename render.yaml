# Blueprint Render — SQLite (plan free, sin Postgres ni disco persistente).
# Para PostgreSQL: añade DATABASE_URL. Para disco: upgrade a plan de pago.

services:
  - type: web
    name: flowpremium
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # aptfile installs ffmpeg for subtitle extraction
    startCommand: gunicorn -c gunicorn.conf.py app:app
    releaseCommand: flask init-db
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEED_DEFAULT_USERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
