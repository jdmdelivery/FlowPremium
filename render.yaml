# Blueprint para Render: https://render.com/docs/blueprint-spec
# Conecta el repo y usa "New > Blueprint" o crea Web Service + Postgres manualmente.

databases:
  - name: streaming-db
    plan: free
    databaseName: streaming
    user: streaming

services:
  - type: web
    name: peliculas-streaming
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:app
    releaseCommand: flask init-db
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORAGE_PATH
        value: /opt/render/project/src/storage/streaming
      - key: SEED_DEFAULT_USERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streaming-db
          property: connectionString
    disk:
      name: streaming-uploads
      mountPath: /opt/render/project/src/storage
      sizeGB: 10
