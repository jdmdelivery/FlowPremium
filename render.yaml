# Blueprint Render — SQLite por defecto (sin Postgres).
# Para PostgreSQL más adelante: crea una DB en Render y define DATABASE_URL.

services:
  - type: web
    name: flowpremium
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:app
    releaseCommand: flask init-db
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORAGE_PATH
        value: /opt/render/project/src/storage/streaming
      - key: SEED_DEFAULT_USERS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: flowpremium-data
      mountPath: /opt/render/project/src
      sizeGB: 1
